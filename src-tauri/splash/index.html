<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OpenSpec Studio</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #71717a;
        --border: #e4e4e7;
        --card: #ffffff;
        --danger: #dc2626;
        --accent: #f3680f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
          --card: #18181b;
          --danger: #f87171;
          --accent: #fa7c20;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      main { width: min(640px, calc(100vw - 32px)); text-align: center; }
      /* Title bar area (overlay style): lets the window be moved while loading or on error. */
      .titlebar { position: fixed; top: 0; left: 0; right: 0; height: 28px; }
      .logo { display: block; width: 72px; height: 72px; margin: 0 auto 20px; filter: drop-shadow(0 6px 14px rgb(216 74 0 / 0.3)); }
      .spinner {
        width: 28px; height: 28px; margin: 0 auto 16px;
        border: 3px solid var(--border); border-top-color: var(--accent);
        border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
      p { color: var(--muted); margin: 0; }
      #error { display: none; text-align: left; }
      #error h1 { color: var(--danger); }
      pre {
        margin: 16px 0 0; padding: 12px; max-height: 50vh; overflow: auto;
        background: var(--card); border: 1px solid var(--border); border-radius: 8px;
        font: 12px/1.45 ui-monospace, "JetBrains Mono", monospace; white-space: pre-wrap;
        -webkit-user-select: text; user-select: text;
      }
      a { color: var(--accent); }
      .link { margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region></div>
    <main>
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fc9e47"/>
            <stop offset="1" stop-color="#d84a00"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>
        <path transform="translate(16 16) scale(0.95) translate(-12 -12)" d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div id="loading">
        <div class="spinner"></div>
        <h1>Starting OpenSpec Studio…</h1>
        <p>Waiting for the local backend.</p>
      </div>
      <div id="error">
        <h1>OpenSpec Studio could not start</h1>
        <p id="message"></p>
        <p class="link" id="link"></p>
        <pre id="details"></pre>
      </div>
    </main>
    <script>
      // The shell reports startup failures by navigating here with a
      // percent-encoded JSON payload in the fragment.
      function render() {
        if (location.hash.length < 2) return
        let payload
        try {
          payload = JSON.parse(decodeURIComponent(location.hash.slice(1)))
        } catch {
          return
        }
        document.getElementById('loading').style.display = 'none'
        document.getElementById('error').style.display = 'block'
        document.getElementById('message').textContent = payload.message || ''
        const details = document.getElementById('details')
        details.textContent = payload.details || ''
        details.style.display = payload.details ? 'block' : 'none'
        const link = document.getElementById('link')
        link.textContent = ''
        if (payload.link) {
          const a = document.createElement('a')
          a.href = payload.link
          a.textContent = 'Open the running backend anyway'
          link.appendChild(a)
        }
      }
      window.addEventListener('hashchange', render)
      render()
    </script>
  </body>
</html>
